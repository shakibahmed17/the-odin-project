<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper and Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Rock, Paper and Scissors Game</h1>

    <button onclick="playRound(getHumanChoice(1), getComputerChoice())">
        Rock
    </button>

    <button onclick="playRound(getHumanChoice(2), getComputerChoice())">
        Paper
    </button>

    <button onclick="playRound(getHumanChoice(3), getComputerChoice())">
        Scissors
    </button>

    <button onclick="resetGame()">
        Reset Game
    </button>

    <p class="reset-text"></p>
    <p class="scoreboard-text"></p>

    <script src="script.js"></script>
</body>
</html>
