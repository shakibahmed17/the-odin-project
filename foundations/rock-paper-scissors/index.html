<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper and Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="game-title">Rock Paper Scissors</h1>

    <div class="round-info">
        <p class="round-text">Round Left</p>
        <p class="round-left"></p>
    </div>

    <div class="options">
        <button class="option" onclick="playRound('Rock')">
        <img class="emoji" src="assets/rock.png" alt="Rock Emoji">
        </button>

        <button class="option" onclick="playRound('Paper')">
            <img class="emoji" src="assets/paper.png" alt="Paper Emoji">
        </button>

        <button class="option" onclick="playRound('Scissors')">
            <img class="emoji" src="assets/scissors.png" alt="Scissors Emoji">
        </button>
    </div>
    <br>

    <div class="scoreboard">
        <div class="score player-part">
            <p class="win-text">You Win</p>
            <p class="player-score"></p>
        </div>
        <div class="score tie-part">
            <p class="win-text">Tie</p>
            <p class="tie-score"></p>
        </div>
        <div class="score computer-part">
            <p class="win-text">Computer Win</p>
            <p class="computer-score"></p>
        </div>
    </div>

    <p class="round-result"></p>
    <p class="final-result"></p>

    <div class="reset">
        <button class="reset-btn" onclick="resetGame()">
            Reset Game
        </button>
    </div>
    <p class="reset-text"></p>

    <script src="script.js"></script>
</body>
</html>
